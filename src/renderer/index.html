<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' cv:; img-src 'self' cv: https: data:; media-src cv:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src cv:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showtrove</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="brand" id="brand" aria-label="Showtrove home">
      <svg viewBox="0 0 120 120" width="30" height="30" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#1f232c"/><circle cx="60" cy="50" r="25" fill="#ffcf7a"/><path d="M49 64h22l8 34H41z" fill="#ffcf7a"/><path d="M53 38.5v23L72 50z" fill="#1f232c"/></svg>
      <span>showtrove</span>
    </button>

    <nav class="switch" id="switch" role="tablist" aria-label="Library sections">
      <span class="switch-pill" id="switchPill" aria-hidden="true"></span>
      <button role="tab" data-view="home" aria-selected="true">Home</button>
      <button role="tab" data-view="movies">Movies</button>
      <button role="tab" data-view="tv">TV shows</button>
    </nav>

    <div class="top-actions">
      <button class="upd-pill" id="updPill" hidden title="A new version of Showtrove"><i></i><span>Update</span></button>
      <label class="search" id="searchBox">
        <span class="sr-only">Search your library</span>
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="searchInput" type="search" placeholder="Search movies, shows, people" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>
      <button class="icon-btn" id="refreshBtn" title="Rescan folders" aria-label="Rescan folders"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings"><svg class="ic"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <div class="status" id="status" hidden></div>

  <main id="main" tabindex="-1"></main>

  <div class="layer" id="detailLayer" hidden></div>
  <div class="layer modal-layer" id="modalLayer" hidden></div>
  <div class="layer player-layer" id="playerLayer" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- One icon set: 24px grid, 1.75 stroke, round caps -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l12-7.2a1 1 0 0 0 0-1.72l-12-7.2A1 1 0 0 0 7 4.8z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></symbol>
      <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></symbol>
      <symbol id="i-unfull" viewBox="0 0 24 24"><path d="M8 4v4H4M16 4v4h4M8 20v-4H4M16 20v-4h4"/></symbol>
      <symbol id="i-back10" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/><text x="12.2" y="15.4" font-size="6.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="Switzer" font-weight="600">10</text></symbol>
      <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3L19.5 9"/><path d="M19.5 4.5V9H15"/><text x="11.8" y="15.4" font-size="6.6" text-anchor="middle" fill="currentColor" stroke="none" font-family="Switzer" font-weight="600">10</text></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5.5v13l9.5-6.5z" fill="currentColor"/><path d="M18.5 5v14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="m8 2.5 4 3.5 4-3.5M8 21h8"/></symbol>
      <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="m12 13 4-4"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="m4 20 11-11M14 4v3M12.5 5.5h3M19 9v3M17.5 10.5h3M18 3v1M19 4.5"/></symbol>
      <symbol id="i-trailer" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10.2 9.5v5l4.3-2.5z" fill="currentColor"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    </defs>
  </svg>

  <script src="ui.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
